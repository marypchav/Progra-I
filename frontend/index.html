<!-- VENTANA PRINCIPAL -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Lista de Empleados</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card card-ancha">
    <div class="card-header">
      <span class="header-icon">👥</span>
      <h1>Lista de Empleados</h1>
    </div>

    <div class="card-body">
      <div class="contenedor-tabla">
        <table>
          <thead>
            <tr><th>id</th><th>Nombre</th><th>Salario</th></tr>
          </thead>
          <tbody id="tabla-empleados">
            <!-- las filas se llenan con JS -->
          </tbody>
        </table>
      </div>

      <button id="btn-insertar" class="btn-primario" onclick="window.location.href='insertar.html'">Insertar</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
